name: Audit workbench
on:
  push:
    branches: [fix/deep-audit-20260919]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve compatible npm fixes
        run: |
          mkdir -p /tmp/audit
          npm ci --ignore-scripts
          npm audit fix --ignore-scripts || true
          npm audit --json > /tmp/audit/npm-audit-after.json || test -s /tmp/audit/npm-audit-after.json
          cp package-lock.json /tmp/audit/package-lock.json
          cp package.json /tmp/audit/package.json
          tar -czf /tmp/audit/frontend-dependencies.tar.gz node_modules
      - name: Audit Rust lockfile
        run: |
          cargo install cargo-audit --locked
          cd src-tauri
          cargo audit --json > /tmp/audit/cargo-audit.json || test -s /tmp/audit/cargo-audit.json
          cat /tmp/audit/cargo-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: /tmp/audit/
          retention-days: 3
