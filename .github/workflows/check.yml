name: Test and Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: recch-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend regression tests
        run: npm test
      - name: Frontend typecheck and production build
        run: npm run build
      - name: Dependency advisory check
        run: npm audit --audit-level=high
      - name: Backend compile check
        working-directory: src-tauri
        run: cargo check --locked
      - name: Backend unit tests
        working-directory: src-tauri
        run: cargo test --locked --lib
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: recch_ci_only
          POSTGRES_DB: recch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: recch_ci_only
          MYSQL_DATABASE: recch_test
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -precch_ci_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RECCH_TEST_PG_URL: postgres://postgres:recch_ci_only@127.0.0.1:5432/recch_test
      RECCH_TEST_MYSQL_URL: mysql://root:recch_ci_only@127.0.0.1:3306/recch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - name: Disposable-database integration tests
        working-directory: src-tauri
        run: cargo test --locked --lib -- --ignored --test-threads=1
